<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Grok Bot">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">

<title>Grok Bot</title>

<body>
<div id="banner" class="banner" hidden></div>
<main id="screen"></main>
<nav id="tabs" class="tabbar">
  <button data-tab="home" class="tab on"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button data-tab="agents" class="tab"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.2"/><circle cx="16.5" cy="9.5" r="2.6"/><path d="M2.5 19c0-3.2 2.4-5.2 5.5-5.2s5.5 2 5.5 5.2zM14 19c0-2.2 1.2-3.8 3.4-3.8 2.4 0 4.1 1.4 4.1 3.8z"/></svg><span>Agents</span></button>
  <button data-tab="activity" class="tab"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Activity</span></button>
  <button data-tab="news" class="tab"><svg viewBox="0 0 24 24"><path d="M5 5h11a2 2 0 0 1 2 2v13H6.5A1.5 1.5 0 0 1 5 18.5V5z" fill="none" stroke-width="1.8"/><path d="M20 8v12a2 2 0 0 1-2 2H7" fill="none" stroke-width="1.8"/><path d="M8 9h7M8 13h7M8 17h4" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg><span>News</span></button>
  <button data-tab="account" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7z"/></svg><span>Account</span></button>
</nav>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
